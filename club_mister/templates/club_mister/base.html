<!DOCTYPE html>

<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'ar' or LANGUAGE_CODE == 'he' or LANGUAGE_CODE == 'fa' %}rtl{% else %}ltr{% endif %}">

<head>
  {% load static %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClubMister</title>
  <link rel="stylesheet" href="{% static 'estilo.css' %}"> 
    
  {% load i18n %}
  {% load django_bootstrap5 %}
  {% bootstrap_css %}
  {% bootstrap_javascript %}
  
  <style>
    .dropdown-item img {
      width: 20px;
      height: 20px;
      margin-right: 10px;
    }
    .custom-font-size {
      font-size: 2.5rem; /* Cambia el tamaño de la fuente aquí */
    }
    /* Evitar que textos largos rompan el layout */
    .allow-wrap, .nav-link, .navbar-text, .team-title {
      white-space: normal !important;
      overflow-wrap: anywhere;
    }
    /* Compensar navbar fixed-top */
    body { padding-top: 100px; }
  </style>

</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 border fixed-top" style="height: 90px;">
    <div class="container-fluid">
      <img src="{% static 'imagenes/logo.png' %}" alt="Logo">

      <!--Boton de colapso-->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav mx-auto">
          {% if user.is_authenticated %}
              <li class="nav-item">
                <b><h1>{{ nombre_equipo }}</h1></b>
              </li>
          {% else %}
            <li class="nav-item">
              <b><span class="navbar-text custom-font-size">CLUBMISTER</span></b>
            </li>
          {% endif %}
        </ul>
        <div class="dropdown ms-3 mb-0">
          <form method="post" action="{% url 'set_language' %}">
              {% csrf_token %}
              <input type="hidden" name="next" value="{{ request.get_full_path }}" />
            <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                  {% trans "Selecciona un idioma" %}
            </button>
            <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
              <li>
                <button type="submit" class="dropdown-item" name="language" value="es">
                  <img src="{% static 'imagenes/banderas/spa.jpg' %}" alt="Español"> Español
                </button>
              </li>
              <li>
                <button type="submit" class="dropdown-item" name="language" value="en">
                  <img src="{% static 'imagenes/banderas/england.jpg' %}" alt="Inglés"> English
                </button>
              </li>
            </ul>
          </form>
        </div>
      </div>
    </div>
  </nav>
        
{% block contenido %}{% endblock contenido %}

</body>

</html>
