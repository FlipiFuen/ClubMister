
{% extends 'club_mister/base.html' %}
{% load i18n %}

{% block title %}Registro | ClubMister{% endblock %}

{% block contenido %}
  <div class="login-container">
    <div class="card p-4 bg-success text-white" style="width: 400px;">
      <h1>{% trans "Crear cuenta" %}</h1>

      <form method="post">
        {% csrf_token %}
        {{ formulario.as_p }}
        <button class="btn btn-primary w-100" name="submit">{% trans "Registrarme" %}</button>
      </form>
    </div>
  </div>
{% endblock %}
